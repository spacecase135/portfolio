            }

            context.restore();
        }

        function drawMetatronsCube(time) {
            const portrait =
                canvasHeight > canvasWidth;

            const centerX =
                canvasWidth *
                (
                    portrait
                        ? 0.72
                        : 0.68
                );

            const centerY =
                canvasHeight *
                (
                    portrait
                        ? 0.54
                        : 0.57
                );

            const radius =
                Math.min(
                    canvasWidth,
                    canvasHeight
                ) *
                (
                    portrait
                        ? 0.19
                        : 0.22
                ) *
                (
                    1 +
                    sound.bass * 0.12
                );

            const points = [{
                x: 0,
                y: 0
            }];

            for (
                let ring = 1;
                ring <= 2;
                ring++
            ) {
                for (
                    let point = 0;
                    point < 6;
                    point++
                ) {
                    const angle =
                        point / 6 *
                        Math.PI * 2;

                    const ringRadius =
                        radius *
                        (
                            ring === 1
                                ? 0.5
                                : 1
                        );

                    points.push({
                        x:
                            Math.cos(angle) *
                            ringRadius,
                        y:
                            Math.sin(angle) *
                            ringRadius
                    });
                }
            }

            context.save();
            context.translate(
                centerX,
                centerY
            );
            context.rotate(
                -time * 0.000017
            );
            context.globalCompositeOperation =
                "lighter";

            context.lineWidth = 0.45;
            context.shadowColor =
                "rgba(103, 210, 255, 0.42)";
            context.shadowBlur = 5;

            for (
                let first = 0;
                first < points.length;
                first++
            ) {
                for (
                    let second = first + 1;
                    second < points.length;
                    second++
                ) {
                    const distance =
                        Math.hypot(
                            points[first].x -
                            points[second].x,
                            points[first].y -
                            points[second].y
                        );

                    if (
                        distance >
                        radius * 1.22
                    ) {
                        continue;
                    }

                    context.beginPath();
                    context.moveTo(
                        points[first].x,
                        points[first].y
                    );
                    context.lineTo(
                        points[second].x,
                        points[second].y
                    );

                    context.strokeStyle =
                        `rgba(
                            ${second % 3 === 0 ? 245 : 68},
                            ${second % 3 === 0 ? 91 : 219},
                            255,
                            ${0.04 + sound.lowMid * 0.11}
                        )`;

                    context.stroke();
                }
            }

            for (
                let index = 0;
                index < points.length;
                index++
            ) {
                const circleRadius =
                    radius *
                    (
                        0.12 +
                        sound.mid * 0.025
                    );

                context.beginPath();
                context.arc(
                    points[index].x,
                    points[index].y,
                    circleRadius,
                    0,
                    Math.PI * 2
                );

                context.strokeStyle =
                    `rgba(
                        155,
                        120,
                        255,
                        ${0.045 + sound.mid * 0.12}
                    )`;

                context.stroke();
            }

            context.restore();
        }

        function drawTriangleFabric(time) {
            const portrait =
                canvasHeight > canvasWidth;

            const columns =
                portrait
                    ? 7
                    : 12;

            const rows =
                portrait
                    ? 8
                    : 6;

            const centerY =
                canvasHeight *
                (
                    portrait
                        ? 0.42
                        : 0.4
                );

            const fabricHeight =
                canvasHeight *
                (
                    portrait
                        ? 0.62
                        : 0.68
                );

            const cellWidth =
                canvasWidth /
                columns;

            const cellHeight =
                fabricHeight /
                rows;

            const top =
                centerY -
                fabricHeight * 0.5;

            context.save();
            context.globalCompositeOperation =
                "lighter";
            context.lineWidth = 0.42;

            for (
                let row = 0;
                row < rows;
                row++
            ) {
                for (
                    let column = 0;
                    column < columns;
                    column++
                ) {
                    const x =
                        column * cellWidth;

                    const y =
                        top +
                        row * cellHeight;

                    const fold =
                        Math.sin(
                            column * 1.31 +
                            row * 0.88 +
                            time * 0.00024
                        ) *
                        (
                            4 +
                            sound.lowMid * 19
                        );

                    const alternate =
                        (
                            row + column
                        ) % 2 === 0;

                    context.beginPath();

                    if (alternate) {
                        context.moveTo(
                            x,
                            y + fold
                        );
                        context.lineTo(
                            x + cellWidth,
                            y + cellHeight - fold
                        );
                        context.lineTo(
                            x,
                            y + cellHeight + fold
                        );
                    } else {
                        context.moveTo(
                            x + cellWidth,
                            y - fold
                        );
                        context.lineTo(
                            x,
                            y + cellHeight + fold
                        );
                        context.lineTo(
                            x + cellWidth,
                            y + cellHeight - fold
                        );
                    }

                    context.closePath();

                    const alpha =
                        0.025 +
                        sound.lowMid * 0.065;

                    context.strokeStyle =
                        alternate
                            ? `rgba(42, 221, 255, ${alpha})`
                            : `rgba(235, 75, 255, ${alpha})`;

                    context.stroke();

                    if (
                        (
                            row * columns +
                            column
                        ) % 5 === 0
                    ) {
                        context.fillStyle =
                            alternate
                                ? `rgba(0, 225, 224, ${alpha * 0.16})`
                                : `rgba(255, 42, 167, ${alpha * 0.14})`;

                        context.fill();
                    }
                }
            }

            context.restore();
        }

        function drawCrystallineStructures(time) {
            const portrait =
                canvasHeight > canvasWidth;

            const centerX =
                canvasWidth * 0.5;

            const centerY =
                canvasHeight *
                (
                    portrait
                        ? 0.42
                        : 0.4
                );

            const scale =
                Math.min(
                    canvasWidth,
                    canvasHeight
                ) /
                820;

            function branch(
                length,
                depth,
                direction
            ) {
                if (depth === 0) {
                    return;
                }

                context.beginPath();
                context.moveTo(0, 0);
                context.lineTo(
                    0,
                    -length
                );
                context.stroke();

                context.translate(
                    0,
                    -length
                );

                const foldAngle =
                    0.42 +
                    sound.high * 0.16 +
                    Math.sin(
                        time * 0.0002 +
                        depth
                    ) *
                    0.045;

                context.save();
                context.rotate(
                    foldAngle * direction
                );
                branch(
                    length * 0.68,
                    depth - 1,
                    direction
                );
                context.restore();

                context.save();
                context.rotate(
                    -foldAngle * direction
                );
                branch(
                    length * 0.68,
                    depth - 1,
                    direction
                );
                context.restore();
            }

            context.save();
            context.globalCompositeOperation =
                "lighter";
            context.lineWidth = 0.58;
            context.strokeStyle =
                `rgba(
                    173,
                    211,
                    255,
                    ${0.06 + sound.high * 0.15}
                )`;
            context.shadowColor =
                "rgba(77, 203, 255, 0.48)";
            context.shadowBlur =
                5 +
                sound.high * 9;

            for (
                let crystal = 0;
                crystal < 4;
                crystal++
            ) {
                const side =
                    crystal < 2
                        ? -1
                        : 1;

                const tier =
                    crystal % 2;

                context.save();
                context.translate(
                    centerX +
                    side *
                    canvasWidth *
                    (
                        0.19 +
                        tier * 0.16
                    ),
                    centerY +
                    (
                        tier === 0
                            ? 1
                            : -1
                    ) *
                    canvasHeight *
                    0.08
                );

                context.rotate(
                    side *
                    (
                        0.6 +
                        tier * 0.34
                    ) +
                    Math.sin(
                        time * 0.00012 +
                        crystal
                    ) *
                    0.06
                );

                branch(
                    (
                        32 +
                        sound.high * 25
                    ) *
                    scale,
                    4,
                    side
                );

                context.restore();
            }

            context.restore();
        }

        function drawOceanStrands(time) {
            const portrait =
                canvasHeight > canvasWidth;

            const strandCount = 13;

            const centerY =
                canvasHeight *
                (
                    portrait
                        ? 0.42
                        : 0.4
                );

            const totalSpread =
                canvasHeight *
                (
                    portrait
                        ? 0.4
                        : 0.5
                );

            const horizontalPadding =
                canvasWidth * 0.015;

            const usableWidth =
                canvasWidth -
                horizontalPadding * 2;

            const steps =
                canvasWidth < 760
                    ? 130
                    : 220;

            const phase =
                audio.paused
                    ? time * 0.00016
                    : audio.currentTime * 0.31;

            context.save();
            context.globalCompositeOperation =
                "lighter";

            for (
                let strand = 0;
                strand < strandCount;
                strand++
            ) {
                const strandRatio =
                    strand /
                    (strandCount - 1);

                const baseY =
                    centerY +
                    (
                        strandRatio - 0.5
                    ) *
                    totalSpread;

                const centerWeight =
                    1 -
                    Math.abs(
                        strandRatio - 0.5
                    ) *
                    1.5;

                context.beginPath();

                for (
                    let step = 0;
                    step <= steps;
                    step++
                ) {
                    const normalizedX =
                        step / steps;

                    const spectrum =
                        spectrumValue(
                            Math.abs(
                                normalizedX - 0.5
                            ) * 2,
                            time
                        );

                    const slowSwell =
                        Math.sin(
                            normalizedX *
                            (
                                6.5 +
                                strand * 0.16
                            ) +
                            phase *
                            (
                                0.72 +
                                strand * 0.035
                            ) +
                            strand * 0.64
                        ) *
                        (
                            3 +
                            sound.bass * 18
                        );

                    const crossCurrent =
                        Math.cos(
                            normalizedX * 17 -
                            phase * 1.18 +
                            strand * 0.42
                        ) *
                        (
                            1.5 +
                            sound.lowMid * 10
                        );

                    const spectralLift =
                        (
                            spectrum - 0.07
                        ) *
                        (
                            10 +
                            Math.max(
                                0,
                                centerWeight
                            ) * 18
                        ) *
                        (
                            strand % 2 === 0
                                ? 1
                                : -1
                        );

                    const y =
                        baseY +
                        slowSwell +
                        crossCurrent +
                        spectralLift;

                    const x =
                        horizontalPadding +
                        normalizedX *
                        usableWidth;

                    if (step === 0) {
                        context.moveTo(x, y);
                    } else {
                        context.lineTo(x, y);
                    }
                }

                const huePosition =
                    strandRatio;

                const red =
                    Math.round(
                        24 +
                        huePosition * 226
                    );

                const green =
                    Math.round(
                        228 -
                        huePosition * 142
                    );

                const blue = 255;

                context.lineWidth =
                    strand === 6
                        ? 0.9
                        : 0.48;

                context.strokeStyle =
                    `rgba(
                        ${red},
                        ${green},
                        ${blue},
                        ${0.055 + sound.energy * 0.09}
                    )`;

                context.shadowColor =
                    `rgba(
                        ${red},
                        ${green},
                        ${blue},
                        0.42
                    )`;

                context.shadowBlur =
                    strand % 3 === 0
                        ? 6
                        : 3;

                context.stroke();
            }

            context.restore();
        }

        function drawNeuralField(time) {
            const portrait =
                canvasHeight > canvasWidth;

            const centerX =
                canvasWidth * 0.5;

            const centerY =
                canvasHeight *
                (
                    portrait
                        ? 0.42
                        : 0.4
                );

            const spreadY =
                Math.min(
                    canvasHeight * 0.24,
                    canvasWidth * 0.25
                );

            const nodes = [];
            const nodePairs = 17;

            for (
                let index = 0;
                index < nodePairs;
                index++
            ) {
                const seed =
                    index * 7.137;

                const radialPosition =
                    0.08 +
                    index /
                    (nodePairs - 1) *
                    0.4;

                const drift =
                    Math.sin(
                        time * 0.00018 +
                        seed
                    ) *
                    8;

                const y =
                    centerY +
                    Math.sin(
                        seed * 1.73 +
                        time * 0.00011
                    ) *
                    spreadY *
                    (
                        0.24 +
                        index /
                        nodePairs *
                        0.76
                    );

                const xOffset =
                    canvasWidth *
                    radialPosition +
                    drift;

                nodes.push({
                    x: centerX - xOffset,
                    y,
                    side: -1,
                    seed
                });

                nodes.push({
                    x: centerX + xOffset,
                    y,
                    side: 1,
                    seed
                });
            }

            context.save();
            context.globalCompositeOperation = "lighter";
            context.lineWidth = 0.55;
            context.shadowBlur = 4;

            for (
                let first = 0;
                first < nodes.length;
                first++
            ) {
                for (
                    let second = first + 1;
                    second < nodes.length;
                    second++
                ) {
                    const nodeA = nodes[first];
                    const nodeB = nodes[second];

                    if (
                        nodeA.side !== nodeB.side
                    ) {
                        continue;
                    }

                    const distance =
                        Math.hypot(
                            nodeA.x - nodeB.x,
                            nodeA.y - nodeB.y
                        );

                    const connectionLimit =
                        Math.min(
                            canvasWidth * 0.16,
                            190
                        );

                    if (
                        distance >
                        connectionLimit
                    ) {
                        continue;
                    }

                    const alpha =
                        (
                            1 -
                            distance /
                            connectionLimit
                        ) *
                        (
                            0.085 +
                            sound.mid * 0.11
                        );

                    context.beginPath();
                    context.moveTo(
                        nodeA.x,
                        nodeA.y
                    );
                    context.lineTo(
                        nodeB.x,
                        nodeB.y
                    );

                    context.strokeStyle =
                        nodeA.side < 0
                            ? `rgba(58, 194, 255, ${alpha})`
                            : `rgba(221, 74, 255, ${alpha})`;

                    context.stroke();
                }
            }

            for (
                let index = 0;
                index < nodes.length;
                index++
            ) {
                const node = nodes[index];

                const radius =
                    0.8 +
                    (
                        index % 4
                    ) *
                    0.38 +
                    sound.high * 1.1;

                context.beginPath();
                context.arc(
                    node.x,
                    node.y,
                    radius,
                    0,
                    Math.PI * 2
                );

                context.fillStyle =
                    node.side < 0
                        ? `rgba(78, 220, 255, ${0.26 + sound.high * 0.2})`
                        : `rgba(240, 86, 255, ${0.22 + sound.high * 0.2})`;

                context.shadowColor =
                    node.side < 0
                        ? "rgba(0, 229, 255, 0.55)"
                        : "rgba(255, 61, 226, 0.5)";

                context.fill();
            }

            for (
                let branch = 0;
                branch < 6;
                branch++
            ) {
                const side =
                    branch % 2 === 0
                        ? -1
                        : 1;

                const branchIndex =
                    Math.floor(branch / 2);

                context.beginPath();
                context.moveTo(
                    centerX,
                    centerY
                );

                for (
                    let segment = 1;
                    segment <= 11;
                    segment++
                ) {
                    const progress =
                        segment / 11;

                    const x =
                        centerX +
                        side *
                        progress *
                        canvasWidth *
                        (
                            0.25 +
                            branchIndex * 0.065
                        );

                    const y =
                        centerY +
                        Math.sin(
                            progress *
                            (
                                8.5 +
                                branchIndex * 2.2
                            ) +
                            time * 0.00036 +
                            branchIndex * 1.9
                        ) *
                        spreadY *
                        (
                            0.12 +
                            progress * 0.22
                        );

                    context.lineTo(x, y);
                }

                context.lineWidth =
                    0.65 +
                    sound.high * 0.6;

                context.strokeStyle =
                    side < 0
                        ? `rgba(84, 210, 255, ${0.11 + sound.energy * 0.12})`
                        : `rgba(255, 82, 224, ${0.1 + sound.energy * 0.12})`;

                context.shadowColor =
                    side < 0
                        ? "rgba(0, 219, 255, 0.55)"
                        : "rgba(255, 38, 181, 0.5)";

                context.shadowBlur = 7;
                context.stroke();
            }

            context.restore();
        }

        function drawNeonBands(time) {
            const portrait =
                canvasHeight > canvasWidth;

            const centerY =
                canvasHeight *
                (
                    portrait
                        ? 0.42
                        : 0.4
                );

            const sampleCount =
                canvasWidth < 760
                    ? 128
                    : 210;

            const maximumHeight =
                Math.min(
                    canvasHeight *
                    (
                        portrait
                            ? 0.16
                            : 0.23
                    ),
                    canvasWidth * 0.22
                );

            const horizontalPadding =
                portrait
                    ? canvasWidth * 0.025
                    : canvasWidth * 0.015;

            const usableWidth =
                canvasWidth -
                horizontalPadding * 2;

            const values = [];

            for (
                let index = 0;
                index < sampleCount;
                index++
            ) {
                const normalizedX =
                    index /
                    (sampleCount - 1);

                const distanceFromCenter =
                    Math.abs(
                        normalizedX - 0.5
                    ) *
                    2;

                const edgeEnvelope =
                    Math.pow(
                        Math.sin(
                            normalizedX *
                            Math.PI
                        ),
                        0.28
                    );

                const frequency =
                    spectrumValue(
                        distanceFromCenter,
                        time
                    );

                const centerFocus =
                    Math.exp(
                        -Math.pow(
                            (
                                normalizedX -
                                0.5
                            ) /
                            0.2,
                            2
                        )
                    );

                const bassBody =
                    sound.bass *
                    (
                        0.34 +
                        centerFocus * 1.06
                    );

                const waveTexture =
                    Math.sin(
                        distanceFromCenter * 31 -
                        time * 0.0011
                    ) *
                    (
                        0.018 +
                        sound.mid * 0.05
                    );

                values.push(
                    Math.max(
                        0.018,
                        (
                            frequency *
                            (
                                0.56 +
                                centerFocus * 0.42
                            ) +
                            bassBody * 0.38 +
                            waveTexture * 0.62
                        ) *
                        edgeEnvelope
                    )
                );
            }

            /*
                Spatial smoothing removes the harsh equalizer
                "teeth" while preserving broad musical peaks.
            */
            for (
                let pass = 0;
                pass < 3;
                pass++
            ) {
                const softened = [];

                for (
                    let index = 0;
                    index < values.length;
                    index++
                ) {
                    let total = 0;
                    let weight = 0;

                    for (
                        let offset = -4;
                        offset <= 4;
                        offset++
                    ) {
                        const sampleIndex =
                            Math.max(
                                0,
                                Math.min(
                                    values.length - 1,
                                    index + offset
                                )
                            );

                        const sampleWeight =
                            5 -
                            Math.abs(offset);

                        total +=
                            values[sampleIndex] *
                            sampleWeight;

                        weight += sampleWeight;
                    }

                    softened.push(
                        total / weight
                    );
                }

                values.splice(
                    0,
                    values.length,
                    ...softened
                );
            }

            const neonGradient =
                context.createLinearGradient(
                    horizontalPadding,
                    0,
                    canvasWidth -
                    horizontalPadding,
                    0
                );

            neonGradient.addColorStop(
                0,
                "#00e8df"
            );

            neonGradient.addColorStop(
                0.36,
                "#3aa7ff"
            );

            neonGradient.addColorStop(
                0.66,
                "#b45cff"
            );

            neonGradient.addColorStop(
                0.88,
                "#ff2794"
            );

            neonGradient.addColorStop(
                1,
                "#52fff1"
            );

            context.save();
            context.globalCompositeOperation = "lighter";

            for (
                let layer = 4;
                layer >= 0;
                layer--
            ) {
                const layerScale =
                    1 -
                    layer * 0.105;

                const layerOffset =
                    (
                        layer - 2
                    ) *
                    (
                        4 +
                        sound.mid * 10
                    );

                const opacity =
                    0.055 +
                    (
                        4 - layer
                    ) *
                    0.047;

                for (
                    let mirror = -1;
                    mirror <= 1;
                    mirror += 2
                ) {
                    context.beginPath();

                    for (
                        let index = 0;
                        index < sampleCount;
                        index++
                    ) {
                        const normalizedX =
                            index /
                            (sampleCount - 1);

                        const x =
                            horizontalPadding +
                            normalizedX *
                            usableWidth;

                        const height =
                            values[index] *
                            maximumHeight *
                            layerScale;

                        const y =
                            centerY +
                            mirror *
                            (
                                height +
                                layerOffset
                            );

                        if (index === 0) {
                            context.moveTo(x, y);
                        } else {
                            context.lineTo(x, y);
                        }
                    }

                    context.lineWidth =
                        layer === 0
                            ? 0.9
                            : 0.48;

                    context.strokeStyle =
                        neonGradient;

                    context.globalAlpha =
                        opacity *
                        (
                            mirror === 1
                                ? 0.76
                                : 1
                        );

                    context.shadowColor =
                        layer < 2
                            ? "rgba(62, 225, 255, 0.9)"
                            : "rgba(190, 70, 255, 0.45)";

                    context.shadowBlur =
                        layer < 2
                            ? 8 +
                              sound.high * 13
                            : 3;

                    context.stroke();
                }
            }

            context.globalAlpha =
                0.32 +
                sound.energy * 0.12;

            context.shadowColor =
                "rgba(110, 244, 255, 0.95)";

            context.shadowBlur =
                7 +
                sound.energy * 8;

            context.lineWidth = 0.62;

            context.beginPath();

            context.moveTo(
                horizontalPadding,
                centerY
            );

            context.lineTo(
                canvasWidth -
                horizontalPadding,
                centerY
            );

            context.strokeStyle =
                neonGradient;

            context.stroke();
            context.restore();
        }

        function updateCymaticModes() {
            if (
                !analyser ||
                !frequencyData ||
                audio.paused
            ) {
                cymaticModes.low +=
                    (
                        4.2 -
                        cymaticModes.low
                    ) * 0.018;

                cymaticModes.mid +=
                    (
                        7.4 -
                        cymaticModes.mid
                    ) * 0.018;

                cymaticModes.high +=
                    (
                        12.2 -
                        cymaticModes.high
                    ) * 0.018;

                cymaticModes.centroid +=
                    (
                        0.34 -
                        cymaticModes.centroid
                    ) * 0.018;

                return;
            }

            const ranges = [
                {
                    start: 0.006,
                    end: 0.12,
                    minimumMode: 3,
                    modeSpan: 5
                },
                {
                    start: 0.12,
                    end: 0.48,
                    minimumMode: 6,
                    modeSpan: 6
                },
                {
                    start: 0.48,
                    end: 0.9,
                    minimumMode: 10,
                    modeSpan: 8
                }
            ];

            const targets = [];
            let weightedFrequency = 0;
            let totalEnergy = 0;

            for (
                let rangeIndex = 0;
                rangeIndex < ranges.length;
                rangeIndex++
            ) {
                const range =
                    ranges[rangeIndex];

                const start =
                    Math.floor(
                        frequencyData.length *
                        range.start
                    );

                const end =
                    Math.max(
                        start + 1,
                        Math.floor(
                            frequencyData.length *
                            range.end
                        )
                    );

                let strongestIndex = start;
                let strongestValue = -1;

                for (
                    let index = start;
                    index < end;
                    index++
                ) {
                    const value =
                        frequencyData[index];

                    if (
                        value >
                        strongestValue
                    ) {
                        strongestValue = value;
                        strongestIndex = index;
                    }

                    weightedFrequency +=
                        index * value;

                    totalEnergy += value;
                }

                const normalizedPeak =
                    (
                        strongestIndex -
                        start
                    ) /
                    Math.max(
                        1,
                        end - start - 1
                    );

                targets.push(
                    range.minimumMode +
                    normalizedPeak *
                    range.modeSpan
                );
            }

            const targetCentroid =
                totalEnergy > 0
                    ? weightedFrequency /
                      totalEnergy /
                      frequencyData.length
                    : 0.34;

            const modeEasing = 0.055;

            cymaticModes.low +=
                (
                    targets[0] -
                    cymaticModes.low
                ) *
                modeEasing;

            cymaticModes.mid +=
                (
                    targets[1] -
                    cymaticModes.mid
                ) *
                modeEasing;

            cymaticModes.high +=
                (
                    targets[2] -
                    cymaticModes.high
                ) *
                modeEasing;

            cymaticModes.centroid +=
                (
                    targetCentroid -
                    cymaticModes.centroid
                ) *
                0.045;
        }

        function drawCymaticField(time) {
            updateCymaticModes();

            const portrait =
                canvasHeight > canvasWidth;

            const centerX =
                canvasWidth * 0.5;

            const centerY =
                canvasHeight *
                (
                    portrait
                        ? 0.42
                        : 0.4
                );

            const baseRadius =
                Math.min(
                    canvasWidth,
                    canvasHeight
                ) *
                (
                    portrait
                        ? 0.42
                        : 0.47
                );

            const playbackPhase =
                (
                    audio.paused
                        ? time * 0.00016
                        : audio.currentTime * 0.24
                ) *
                (
                    0.72 +
                    cymaticModes.centroid * 1.4
                );

            const spectrumGradient =
                context.createLinearGradient(
                    centerX - baseRadius,
                    centerY,
                    centerX + baseRadius,
                    centerY
                );

            spectrumGradient.addColorStop(
                0,
                "#00e8df"
            );

            spectrumGradient.addColorStop(
                0.34,
                "#56b7ff"
            );

            spectrumGradient.addColorStop(
                0.62,
                "#bd66ff"
            );

            spectrumGradient.addColorStop(
                0.86,
                "#ff3199"
            );

            spectrumGradient.addColorStop(
                1,
                "#72fff3"
            );

            context.save();
            context.translate(
                centerX,
                centerY
            );

            context.scale(
                portrait
                    ? 0.94
                    : 1.34,
                portrait
                    ? 1.04
                    : 0.76
            );

            context.globalCompositeOperation =
                "lighter";

            /*
                Concentric interference contours. Each contour is
                shaped only by analyzed frequency modes and the
                current playback position.
            */
            const contourCount =
                portrait
                    ? 10
                    : 13;

            for (
                let contour = 1;
                contour <= contourCount;
                contour++
            ) {
                const contourRatio =
                    contour /
                    contourCount;

                context.beginPath();

                const steps =
                    canvasWidth < 760
                        ? 180
                        : 260;

                for (
                    let step = 0;
                    step <= steps;
                    step++
                ) {
                    const angle =
                        step /
                        steps *
                        Math.PI *
                        2;

                    const lowPattern =
                        Math.cos(
                            cymaticModes.low *
                            angle +
                            playbackPhase
                        ) *
                        sound.bass *
                        0.18;

                    const midPattern =
                        Math.sin(
                            cymaticModes.mid *
                            angle -
                            playbackPhase * 0.72
                        ) *
                        sound.lowMid *
                        0.12;

                    const highPattern =
                        Math.cos(
                            cymaticModes.high *
                            angle +
                            playbackPhase * 1.18
                        ) *
                        sound.high *
                        0.055;

                    const radialInterference =
                        Math.sin(
                            contourRatio *
                            Math.PI *
                            (
                                3 +
                                cymaticModes.centroid *
                                8
                            ) +
                            angle *
                            (
                                2 +
                                sound.mid * 2.4
                            )
                        ) *
                        sound.mid *
                        0.065;

                    const radius =
                        baseRadius *
                        contourRatio *
                        (
                            1 +
                            lowPattern +
                            midPattern +
                            highPattern +
                            radialInterference
                        );

                    const x =
                        Math.cos(angle) *
                        radius;

                    const y =
                        Math.sin(angle) *
                        radius *
                        (
                            0.82 +
                            contourRatio * 0.18
                        );

                    if (step === 0) {
                        context.moveTo(x, y);
                    } else {
                        context.lineTo(x, y);
                    }
                }

                context.closePath();

                context.lineWidth =
                    contour % 4 === 0
                        ? 0.9
                        : 0.48;

                context.strokeStyle =
                    spectrumGradient;

                context.globalAlpha =
                    0.075 +
                    contourRatio * 0.12 +
                    sound.energy * 0.11;

                context.shadowColor =
                    contour % 3 === 0
                        ? "rgba(255, 49, 153, 0.46)"
                        : "rgba(38, 218, 255, 0.48)";

                context.shadowBlur =
                    contour % 4 === 0
                        ? 8 +
                          sound.high * 8
                        : 3;

                context.stroke();
            }

            /*
                Nodal spokes expose the modes themselves. The
                number and orientation derive from dominant bands.
            */
            const spokeCount =
                Math.max(
                    8,
                    Math.round(
                        cymaticModes.low +
                        cymaticModes.mid
                    )
                );

            context.lineWidth = 0.5;
            context.shadowBlur = 4;

            for (
                let spoke = 0;
                spoke < spokeCount;
                spoke++
            ) {
                const angle =
                    spoke /
                    spokeCount *
                    Math.PI *
                    2 +
                    playbackPhase * 0.16;

                const innerRadius =
                    baseRadius *
                    (
                        0.08 +
                        sound.bass * 0.05
                    );

                const outerRadius =
                    baseRadius *
                    (
                        0.7 +
                        sound.lowMid * 0.18
                    );

                context.beginPath();
                context.moveTo(
                    Math.cos(angle) *
                    innerRadius,
                    Math.sin(angle) *
                    innerRadius
                );
                context.lineTo(
                    Math.cos(angle) *
                    outerRadius,
                    Math.sin(angle) *
                    outerRadius
                );

                context.strokeStyle =
                    spoke % 2 === 0
                        ? `rgba(0, 232, 223, ${0.055 + sound.lowMid * 0.1})`
                        : `rgba(255, 49, 153, ${0.05 + sound.mid * 0.09})`;

                context.stroke();
            }

            /*
                Direct circular spectrum: every point samples the
                current FFT data, producing an exact audio-driven
                outer membrane with no random displacement.
            */
            const membraneSteps =
                canvasWidth < 760
                    ? 170
                    : 280;

            context.beginPath();

            for (
                let step = 0;
                step <= membraneSteps;
                step++
            ) {
                const normalized =
                    step /
                    membraneSteps;

                const angle =
                    normalized *
                    Math.PI *
                    2;

                const mirroredFrequency =
                    normalized <= 0.5
                        ? normalized * 2
                        : (
                            1 -
                            normalized
                        ) * 2;

                const frequency =
                    spectrumValue(
                        mirroredFrequency,
                        time
                    );

                const radius =
                    baseRadius *
                    (
                        0.76 +
                        frequency * 0.27
                    );

                const x =
                    Math.cos(angle) *
                    radius;

                const y =
                    Math.sin(angle) *
                    radius *
                    0.9;

                if (step === 0) {
                    context.moveTo(x, y);
                } else {
                    context.lineTo(x, y);
                }
            }

            context.closePath();
            context.globalAlpha =
                0.42 +
                sound.energy * 0.16;
            context.lineWidth = 1;
            context.strokeStyle =
                spectrumGradient;
            context.shadowColor =
                "rgba(97, 232, 255, 0.72)";
            context.shadowBlur =
                10 +
                sound.high * 12;
            context.stroke();

            context.restore();
        }

        function drawDistributedMandalas(time) {
            const portrait =
                canvasHeight > canvasWidth;

            const shortSide =
                Math.min(
                    canvasWidth,
                    canvasHeight
                );

            const layouts =
                portrait
                    ? [
                        [0.18, 0.18, 0.23, 0],
                        [0.72, 0.14, 0.19, 2],
                        [0.48, 0.3, 0.27, 1],
                        [0.12, 0.47, 0.2, 3],
                        [0.78, 0.5, 0.25, 1],
                        [0.36, 0.66, 0.22, 2],
                        [0.82, 0.74, 0.18, 0]
                    ]
                    : [
                        [0.1, 0.23, 0.2, 0],
                        [0.29, 0.17, 0.17, 2],
                        [0.48, 0.29, 0.25, 1],
                        [0.69, 0.18, 0.18, 3],
                        [0.9, 0.3, 0.22, 0],
                        [0.22, 0.63, 0.2, 3],
                        [0.76, 0.66, 0.24, 1]
                    ];

            const colors = [
                [0, 232, 223],
                [180, 92, 255],
                [58, 167, 255],
                [255, 49, 153],
                [255, 194, 64],
                [126, 255, 104]
            ];

            const motifWidths = [
                0.5,
                1.2,
                2.4,
                4.5,
                7,
                10,
                14
            ];

            context.save();
            context.globalCompositeOperation =
                "lighter";
            context.lineCap = "round";
            context.lineJoin = "round";

            for (
                let motifIndex = 0;
                motifIndex < layouts.length;
                motifIndex++
            ) {
                const layout =
                    layouts[motifIndex];

                const color =
                    colors[
                        (
                            layout[3] +
                            motifIndex
                        ) %
                        colors.length
                    ];

                const audioDrive =
                    motifIndex % 3 === 0
                        ? sound.bass
                        : motifIndex % 3 === 1
                            ? sound.lowMid
                            : sound.mid;

                const radius =
                    shortSide *
                    layout[2] *
                    (
                        1 +
                        audioDrive * 0.14
                    );

                const sides =
                    5 +
                    (
                        motifIndex % 4
                    );

                context.save();
                context.translate(
                    canvasWidth * layout[0],
                    canvasHeight * layout[1]
                );

                context.rotate(
                    time *
                    (
                        motifIndex % 2 === 0
                            ? 0.000012
                            : -0.000016
                    ) +
                    motifIndex * 0.37
                );

                const motifWidth =
                    motifWidths[
                        motifIndex %
                        motifWidths.length
                    ];

                const motifOpacity =
                    Math.max(
                        0.34,
                        1 -
                        motifWidth / 19
                    );

                context.lineWidth =
                    motifWidth;
                context.shadowColor =
                    `rgba(
                        ${color[0]},
                        ${color[1]},
                        ${color[2]},
                        0.42
                    )`;
                context.shadowBlur =
                    4 +
                    motifWidth * 0.65 +
                    sound.high * 8;

                for (
                    let ring = 1;
                    ring <= 3;
                    ring++
                ) {
                    const ringRadius =
                        radius *
                        (
                            0.36 +
                            ring * 0.21
                        );

                    context.beginPath();

                    for (
                        let vertex = 0;
                        vertex <= sides;
                        vertex++
                    ) {
                        const angle =
                            vertex /
                            sides *
                            Math.PI *
                            2;

                        const fold =
                            1 +
                            Math.sin(
                                angle *
                                (
                                    sides +
                                    ring
                                ) +
                                time * 0.00021
                            ) *
                            audioDrive *
                            0.065;

                        const x =
                            Math.cos(angle) *
                            ringRadius *
                            fold;

                        const y =
                            Math.sin(angle) *
                            ringRadius *
                            fold;

                        if (vertex === 0) {
                            context.moveTo(x, y);
                        } else {
                            context.lineTo(x, y);
                        }
                    }

                    context.closePath();
                    context.strokeStyle =
                        `rgba(
                            ${color[0]},
                            ${color[1]},
                            ${color[2]},
                            ${
                                (
                                    0.065 +
                                    audioDrive * 0.1
                                ) *
                                motifOpacity
                            }
                        )`;
                    context.stroke();
                }

                const petalRadius =
                    radius *
                    (
                        0.18 +
                        sound.mid * 0.025
                    );

                for (
                    let petal = 0;
                    petal < sides;
                    petal++
                ) {
                    const angle =
                        petal /
                        sides *
                        Math.PI *
                        2;

                    context.beginPath();
                    context.arc(
                        Math.cos(angle) *
                        petalRadius,
                        Math.sin(angle) *
                        petalRadius,
                        petalRadius,
                        0,
                        Math.PI * 2
                    );

                    context.strokeStyle =
                        `rgba(
                            ${color[0]},
                            ${color[1]},
                            ${color[2]},
                            ${
                                (
                                    0.05 +
                                    sound.mid * 0.085
                                ) *
                                motifOpacity
                            }
                        )`;
                    context.stroke();
                }

                for (
                    let chord = 0;
                    chord < sides;
                    chord++
                ) {
                    const firstAngle =
                        chord /
                        sides *
                        Math.PI *
                        2;

                    const secondAngle =
                        (
                            chord + 2
                        ) /
                        sides *
                        Math.PI *
                        2;

                    context.beginPath();
                    context.moveTo(
                        Math.cos(firstAngle) *
                        radius * 0.78,
                        Math.sin(firstAngle) *
                        radius * 0.78
                    );
                    context.lineTo(
                        Math.cos(secondAngle) *
                        radius * 0.78,
                        Math.sin(secondAngle) *
                        radius * 0.78
                    );

                    context.strokeStyle =
                        `rgba(
                            ${color[0]},
                            ${color[1]},
                            ${color[2]},
                            ${0.035 + sound.lowMid * 0.075}
                        )`;
                    context.stroke();
                }

                context.restore();
            }

            context.restore();
        }

        function drawGeometricConnectors(time) {
            const portrait =
                canvasHeight > canvasWidth;

            const points =
                portrait
                    ? [
                        [0.18, 0.18],
                        [0.72, 0.14],
                        [0.48, 0.3],
                        [0.12, 0.47],
                        [0.78, 0.5],
                        [0.36, 0.66],
                        [0.82, 0.74]
                    ]
                    : [
                        [0.1, 0.23],
                        [0.29, 0.17],
                        [0.48, 0.29],
                        [0.69, 0.18],
                        [0.9, 0.3],
                        [0.22, 0.63],
                        [0.76, 0.66]
                    ];

            context.save();
            context.globalCompositeOperation =
                "lighter";
            context.lineWidth = 0.42;
            context.shadowBlur = 3;

            for (
                let index = 0;
                index < points.length;
                index++
            ) {
                const current =
                    points[index];

                const next =
                    points[
                        (
                            index + 2
                        ) %
                        points.length
                    ];

                const startX =
                    current[0] *
                    canvasWidth;

                const startY =
                    current[1] *
                    canvasHeight;

                const endX =
                    next[0] *
                    canvasWidth;

                const endY =
                    next[1] *
                    canvasHeight;

                const midpointX =
                    (
                        startX + endX
                    ) *
                    0.5;

                const midpointY =
                    (
                        startY + endY
                    ) *
                    0.5 +
                    Math.sin(
                        time * 0.00015 +
                        index
                    ) *
                    (
                        8 +
                        sound.lowMid * 18
                    );

                context.beginPath();
                context.moveTo(
                    startX,
                    startY
                );
                context.quadraticCurveTo(
                    midpointX,
                    midpointY,
                    endX,
                    endY
                );

                context.strokeStyle =
                    index % 2 === 0
                        ? `rgba(70, 218, 255, ${0.035 + sound.lowMid * 0.065})`
                        : `rgba(239, 74, 255, ${0.032 + sound.mid * 0.06})`;

                context.shadowColor =
                    index % 2 === 0
                        ? "rgba(0, 220, 255, 0.3)"
                        : "rgba(255, 48, 190, 0.28)";

                context.stroke();

                const distance =
                    Math.hypot(
                        endX - startX,
                        endY - startY
                    );

                const vesicaRadius =
                    Math.min(
                        distance * 0.18,
                        Math.min(
                            canvasWidth,
                            canvasHeight
                        ) * 0.1
                    ) *
                    (
                        1 +
                        sound.mid * 0.1
                    );

                context.beginPath();
                context.arc(
                    midpointX -
                    vesicaRadius * 0.42,
                    midpointY,
                    vesicaRadius,
                    0,
                    Math.PI * 2
                );
                context.arc(
                    midpointX +
                    vesicaRadius * 0.42,
                    midpointY,
                    vesicaRadius,
                    0,
                    Math.PI * 2
                );

                context.strokeStyle =
                    `rgba(
                        158,
                        126,
                        255,
                        ${0.028 + sound.mid * 0.06}
                    )`;

                context.stroke();
            }

            context.restore();
        }

                        [0.08, 0.7, 0.17, 2],

                        [0.9, 0.9, 0.07, 5]
                    ]
                    : [
                        [0.06, 0.17, 0.09, 4],
                        [0.28, 0.42, 0.12, 0],
                        [0.46, 0.15, 0.07, 5],
                        [0.65, 0.5, 0.1, 3],
                        [0.86, 0.2, 0.14, 2],
                        [0.14, 0.76, 0.12, 5],
                        [0.45, 0.72, 0.08, 4],
                        [0.89, 0.74, 0.11, 0]
                    ];

            const colors = [
                [0, 232, 223],
                [180, 92, 255],
                [58, 167, 255],
                [255, 49, 153],
                [255, 194, 64],
                [126, 255, 104]
            ];

            const shortSide =
                Math.min(
                    canvasWidth,
                    canvasHeight
                );

            context.save();
            context.globalCompositeOperation =
                "lighter";

            for (
                let motifIndex = 0;
                motifIndex < motifs.length;
                motifIndex++
            ) {
                const motif =
                    motifs[motifIndex];

                const color =
                    colors[motif[3]];

                const drive =
                    motifIndex % 2 === 0
                        ? sound.mid
                        : sound.high;

                const radius =
                    shortSide *
                    motif[2] *
                    (
                        1 +
                        drive * 0.2
                    );

                const brightness =
                    motifIndex % 4 === 0
                        ? 1.35
                        : motifIndex % 3 === 0
                            ? 0.7
                            : 1;

                context.save();
                context.translate(
                    canvasWidth * motif[0],
                    canvasHeight * motif[1]
                );

                context.rotate(
                    time *
                    (
                        motifIndex % 2 === 0
                            ? 0.000028
                            : -0.000021
                    ) +
                    motifIndex * 0.58
                );

                context.lineWidth =
                    motif[2] > 0.11
                        ? 0.72
                        : 0.46;

                context.shadowColor =
                    `rgba(
                        ${color[0]},
                        ${color[1]},
                        ${color[2]},
                        0.58
                    )`;

                context.shadowBlur =
                    (
                        5 +
                        drive * 11
                    ) *
                    brightness;

                for (
                    let triangle = 0;
                    triangle < 2;
                    triangle++
                ) {
                    context.beginPath();

                    for (
                        let vertex = 0;
                        vertex <= 3;
                        vertex++
                    ) {
                        const angle =
                            vertex /
                            3 *
                            Math.PI *
                            2 +
                            (
                                triangle === 0
                                    ? -Math.PI / 2
                                    : Math.PI / 2
                            );

                        const x =
                            Math.cos(angle) *
                            radius;

                        const y =
                            Math.sin(angle) *
                            radius;

                        if (vertex === 0) {
                            context.moveTo(x, y);
                        } else {
                            context.lineTo(x, y);
                        }
                    }

                    context.closePath();

                    context.strokeStyle =
                        `rgba(
                            ${color[0]},
                            ${color[1]},
                            ${color[2]},
                            ${
                                (
                                    0.08 +
                                    drive * 0.14
                                ) *
                                brightness
                            }
                        )`;

                    context.stroke();
                }

                context.rotate(
                    Math.PI / 4
                );

                context.strokeRect(
                    -radius * 0.34,
                    -radius * 0.34,
                    radius * 0.68,
                    radius * 0.68
                );

                context.restore();
            }

            context.restore();
        }

        function drawVisualizer(time) {
            analyzeSound();
            drawBackground(time);

            const spectralHueShift =
                Math.max(
                    -32,
                    Math.min(
                        42,
                        (
                            cymaticModes.centroid -
                            0.34
                        ) *
                        155 +
                        (
                            sound.high -
                            sound.bass
                        ) *
                        38
                    )
                );

            context.save();

            context.filter =
                qualityLevel === 0
                    ? `hue-rotate(
                        ${spectralHueShift}deg
                    )
                    saturate(
                        ${1 + sound.high * 0.22}
                    )`
                    : "none";

            if (qualityLevel < 2) {
                drawTriangleFabric(time);
            }

            drawDistributedMandalas(time);

            if (qualityLevel < 2) {
                drawGeometricConnectors(time);
                drawPrismaticStars(time);
            }

            drawMetatronsCube(time);
            drawOceanStrands(time);
            drawCymaticRain(time);

            context.restore();
        }

        function animate(time) {
            animationFrame =
                requestAnimationFrame(animate);

            const quality =
                qualitySettings[qualityLevel];

            const targetInterval =
                canvasWidth < 760
                    ? 1000 / quality.mobileFps
                    : 1000 / quality.desktopFps;

            if (
                time - lastFrameTime <
                targetInterval
            ) {
                return;
            }

            lastFrameTime = time;

            const renderStarted =
                performance.now();

            drawVisualizer(time);

            performanceSampleTime +=
                performance.now() -
                renderStarted;

            performanceSampleFrames++;

            if (
                time - performanceSampleStarted >
                2400
            ) {
                const averageRenderTime =
                    performanceSampleTime /
                    Math.max(
                        1,
                        performanceSampleFrames
                    );

                const availableRenderTime =
                    targetInterval * 0.82;

                if (
                    averageRenderTime >
                    availableRenderTime &&
                    qualityLevel <
                    qualitySettings.length - 1
                ) {
                    qualityLevel++;
                    resizeCanvas();
                }

                performanceSampleTime = 0;
                performanceSampleFrames = 0;
                performanceSampleStarted = time;
            }
        }

        window.addEventListener(
            "resize",
            resizeCanvas,
            {
                passive: true
            }
        );

        document.addEventListener(
            "visibilitychange",
            () => {
                if (document.hidden) {
                    cancelAnimationFrame(
                        animationFrame
                    );
                } else {
                    animationFrame =
                        requestAnimationFrame(
                            animate
                        );
                }
            }
        );

        /* ============================================================
           START
        ============================================================ */

        buildPlaylist();
        loadTrack(0, false);

        updateMuteButton();

        updateRangeFill(
            volumeRange,
            audio.volume * 100
        );

        resizeCanvas();

        const startVisualizer = () => {
            animationFrame =
                requestAnimationFrame(animate);
        };

        if ("requestIdleCallback" in window) {
            window.requestIdleCallback(
                startVisualizer,
                { timeout: 350 }
            );
        } else {
            window.setTimeout(
                startVisualizer,
                80
            );
        }
    </script>
